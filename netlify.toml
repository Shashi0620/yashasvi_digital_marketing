# Netlify deployment for the Angular 22 SSR site.
# The @netlify/angular-runtime plugin serves prerendered pages from the CDN and
# runs src/server.ts as an Edge Function for everything else.

[build]
  command = "npm run build"
  publish = "dist/yashasvi-digital-solutions/browser"

[build.environment]
  # Angular 22 requires Node ^22.22.3 or ^24.15.0.
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/angular-runtime"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build files never change, so browsers may cache them for a year.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
